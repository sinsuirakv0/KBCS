[package]
name = "kbcs-app"
version.workspace = true
edition.workspace = true
default-run = "kbcs"

[features]
phone-wasm = []

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
kbcs-bridge = { path = "../kbcs-bridge" }
flate2 = "1"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
kbcs-data = { path = "../kbcs-data" }
include_dir = "0.7"
getrandom = "0.4"
tiny_http = "0.12"
url = "2"
zip = { version = "9.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.7"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }

[[bin]]
name = "kbcs"
path = "src/main.rs"

[[bin]]
name = "kbcs-phone"
path = "src/phone_core.rs"
required-features = ["phone-wasm"]
