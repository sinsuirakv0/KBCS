[package]
name = "kbcs-app"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
kbcs-data = { path = "../kbcs-data" }
kbcs-bridge = { path = "../kbcs-bridge" }
include_dir = "0.7"
flate2 = "1"
tiny_http = "0.12"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }

[[bin]]
name = "kbcs"
path = "src/main.rs"
