name: Build and publish one platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      commit:
        required: true
        type: string
      tag:
        required: false
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.98.1
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/research/reference/
            !/research/comparisons/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kbcs-phone-runtime
          path: .local/phone-runtime
      - name: Set phone runtime path
        run: echo "KBCS_PHONE_WASM_DIR=$GITHUB_WORKSPACE/.local/phone-runtime" >> "$GITHUB_ENV"
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --target "$TARGET" --no-self-update
        env:
          TARGET: ${{ inputs.target }}
      - name: Install Windows C++ toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-ci.ps1
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-v2-${{ inputs.platform }}-rust1981-llvm20260922-${{ hashFiles('Cargo.lock') }}-${{ inputs.commit }}-${{ github.run_attempt }}
          restore-keys: |
            build-v2-${{ inputs.platform }}-rust1981-llvm20260922-${{ hashFiles('Cargo.lock') }}-
            build-v2-${{ inputs.platform }}-rust1981-llvm20260922-
      - name: Check Rust lints before building release tests
        id: clippy
        run: cargo clippy --workspace --all-targets --release --locked --target "$TARGET" -- -D warnings
        env:
          TARGET: ${{ inputs.target }}
      - name: Test native calculations and data contracts
        run: cargo test --workspace --release --locked --target "$TARGET" --timings
        env:
          TARGET: ${{ inputs.target }}
      - name: Build app
        run: cargo build --workspace --release --locked --target "$TARGET" --timings
        env:
          TARGET: ${{ inputs.target }}
      - name: Package and check standalone executable
        run: python scripts/package.py --target "$TARGET" --output .local/dist
        env:
          TARGET: ${{ inputs.target }}
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KBCS-${{ inputs.platform }}
          path: |
            .local/dist/KBCS-*.zip
            .local/dist/KBCS-*.zip.sha256
            .local/dist/KBCS-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save compiler cache even after a failed build
        if: ${{ !cancelled() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-${{ inputs.platform }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate and verify a Clippy patch
        id: fix_clippy
        if: ${{ failure() && !cancelled() && steps.clippy.outcome == 'failure' }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          status=$(git status --porcelain)
          if [[ -n "$status" ]]; then
            echo 'The checkout must be clean before generating a Clippy patch.' >&2
            exit 1
          fi
          cargo clippy --fix --allow-dirty --workspace --all-targets --release --locked --target "$TARGET"
          if git diff --quiet HEAD -- '*.rs'; then
            echo 'Clippy did not produce a Rust patch.'
            exit 0
          fi
          cargo clippy --workspace --all-targets --release --locked --target "$TARGET" -- -D warnings
          cargo test --workspace --release --locked --target "$TARGET"
          git diff --quiet HEAD -- . ':(exclude,glob)**/*.rs'
          git diff --check HEAD
          git diff --no-ext-diff --binary --output="$RUNNER_TEMP/kbcs-clippy.patch" HEAD -- '*.rs'
          printf 'Verified Clippy patch base: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Upload verified Clippy patch
        if: ${{ !cancelled() && steps.fix_clippy.outputs.available == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clippy-fix-${{ inputs.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kbcs-clippy.patch
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ inputs.platform }}
    needs: build
    if: inputs.publish && github.repository == 'sinsuirakv0/KBCS' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: kbcs-release
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: KBCS-${{ inputs.platform }}
          path: .local/release
      - name: Verify this platform and publish without waiting for other builds
        env:
          GH_TOKEN: ${{ github.token }}
          KBCS_RELEASE_TAG: ${{ inputs.tag }}
          KBCS_RELEASE_COMMIT: ${{ inputs.commit }}
          KBCS_RELEASE_PLATFORM: ${{ inputs.platform }}
        run: python scripts/publish-release.py
