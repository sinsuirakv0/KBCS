name: Build Windows and macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version X.Y.Z (blank: automatic patch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release version
    if: github.repository == 'sinsuirakv0/KBCS' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/kbcs-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests
      - name: Select and commit release version
        id: version
        env:
          KBCS_RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/prepare-release.py

  checks:
    name: Check UI and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/research/reference/
            !/research/comparisons/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test UI logic
        run: node --test ui/tests/*.test.mjs
      - name: Test release tooling
        if: github.repository != 'sinsuirakv0/KBCS' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/kbcs-v'))
        run: python -m unittest discover -s scripts/tests

  phone-runtime:
    name: Build phone WebAssembly
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .cargo
            crates
            native
            scripts
      - name: Build the phone runtime
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-emscripten --no-self-update
          git clone --depth 1 --branch 5.0.3 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.3
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.3
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          RUSTUP_TOOLCHAIN=1.98.1 python3 scripts/build-phone-runtime.py --output .local/phone-runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kbcs-phone-runtime
          path: .local/phone-runtime/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  build:
    name: ${{ matrix.platform }}
    needs: [prepare, checks, phone-runtime]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.phone-runtime.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-gnullvm
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      commit: ${{ needs.prepare.outputs.commit || github.sha }}
      tag: ${{ needs.prepare.outputs.tag || '' }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
