name: Intel Mac test profile comparison
on: workflow_dispatch

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.98.1
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  TARGET: x86_64-apple-darwin

jobs:
  compare:
    name: Test profile ${{ matrix.profile }}
    runs-on: macos-15-intel
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        profile: [release, ci-test]
    env:
      TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/research/reference/
            !/research/comparisons/
          sparse-checkout-cone-mode: false
      - name: Prepare compiler and dependencies
        shell: bash
        run: |
          sysctl -n machdep.cpu.brand_string hw.logicalcpu
          rustup toolchain install 1.98.1 --profile minimal --component clippy --target "$TARGET" --no-self-update
          cargo fetch --locked --target "$TARGET"
      - name: Measure compiler-cold and dependency-warm builds
        shell: bash
        run: |
          measure_build() {
            local scenario="$1" started=$SECONDS stage=$SECONDS
            cargo clippy --workspace --all-targets --release --locked --target "$TARGET" -- -D warnings
            local clippy_seconds=$((SECONDS - stage))
            stage=$SECONDS
            cargo test --workspace --profile "$TEST_PROFILE" --locked --target "$TARGET"
            local test_seconds=$((SECONDS - stage))
            stage=$SECONDS
            cargo build --workspace --release --locked --target "$TARGET"
            local build_seconds=$((SECONDS - stage))
            printf 'Profile=%s scenario=%s clippy=%ss tests=%ss dist_build=%ss total=%ss\n' \
              "$TEST_PROFILE" "$scenario" "$clippy_seconds" "$test_seconds" "$build_seconds" "$((SECONDS - started))" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          measure_build cold
          cargo clean --workspace --profile release --target "$TARGET"
          if [[ "$TEST_PROFILE" != release ]]; then
            cargo clean --workspace --profile "$TEST_PROFILE" --target "$TARGET"
          fi
          measure_build warm-dependencies
          du -sh target | tee -a "$GITHUB_STEP_SUMMARY"
