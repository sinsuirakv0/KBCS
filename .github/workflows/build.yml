name: Build Windows and macOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version X.Y.Z (blank: automatic patch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release version
    if: github.repository == 'sinsuirakv0/KBCS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/kbcs-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests
      - name: Select and commit release version
        id: version
        env:
          KBCS_RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/prepare-release.py

  checks:
    name: Check UI and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test UI logic
        run: node --test ui/tests/*.test.mjs
      - name: Test release tooling
        if: github.repository != 'sinsuirakv0/KBCS' || github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/kbcs-v'))
        run: python -m unittest discover -s scripts/tests

  build:
    name: ${{ matrix.platform }}
    needs: [prepare, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-gnullvm
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      commit: ${{ needs.prepare.outputs.commit || github.sha }}
      tag: ${{ needs.prepare.outputs.tag || '' }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
