name: Build Windows and macOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version X.Y.Z (blank: automatic patch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.98.1
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  prepare:
    name: Prepare release version
    if: github.repository == 'sinsuirakv0/KBCS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/kbcs-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests
      - name: Select and commit release version
        id: version
        env:
          KBCS_RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/prepare-release.py

  build:
    name: ${{ matrix.platform }}
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-gnullvm
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --target ${{ matrix.target }} --no-self-update
      - name: Install Windows C++ toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-ci.ps1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-v1-${{ matrix.platform }}-rust1981-llvm20260922-${{ hashFiles('Cargo.lock') }}-${{ needs.prepare.outputs.commit || github.sha }}
          restore-keys: |
            build-v1-${{ matrix.platform }}-rust1981-llvm20260922-${{ hashFiles('Cargo.lock') }}-
            build-v1-${{ matrix.platform }}-rust1981-llvm20260922-
      - name: Test native calculations and data contracts
        run: cargo test --workspace --release --locked --target ${{ matrix.target }}
      - name: Check Rust
        run: cargo clippy --workspace --all-targets --release --locked --target ${{ matrix.target }} -- -D warnings
      - name: Test UI logic
        run: node --test ui/tests/*.test.mjs
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests
      - name: Build app
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Package and check standalone executable
        run: python scripts/package.py --target ${{ matrix.target }} --output .local/dist
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KBCS-${{ matrix.platform }}
          path: |
            .local/dist/KBCS-*.zip
            .local/dist/KBCS-*.zip.sha256
            .local/dist/KBCS-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: kbcs-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: KBCS-*
          path: .local/release
          merge-multiple: true
      - name: Verify all packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          KBCS_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          KBCS_RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python scripts/publish-release.py
