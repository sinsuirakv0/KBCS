name: Native analysis pipeline

on:
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:
    inputs:
      source_manifest:
        description: 'Pinned manifest under research/inputs; blank uses the latest verified JP assets'
        type: string
        default: ''
      assets_commit:
        description: 'Commit from the assets publication event; blank checks assets main'
        type: string
        default: ''
      checkpoint:
        description: 'Completed native-analysis Release tag for a replay'
        type: string
        default: ''
      stage:
        description: 'Run the full pipeline or replay one publication stage'
        type: choice
        options: [all, analyze, references, backfill, match]
        default: all
      check_only:
        description: 'Check the source and publication status without analysis or publication'
        type: boolean
        default: false
      revision_label:
        description: 'Keep the same label to resume; change it for a fresh revision'
        type: string
        default: ci-v1
      publish_reference:
        description: 'Replace the published reference for this version and ABI on main'
        type: boolean
        default: true
  repository_dispatch:
    types: [native-analysis-request]

permissions:
  contents: read

concurrency:
  group: native-analysis
  queue: max

env:
  PYTHONPATH: ${{ github.workspace }}/research
  PYTHONUTF8: '1'
  GH_TOKEN: ${{ github.token }}
  PUBLISH_REFERENCE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_reference) || (github.event_name == 'repository_dispatch' && github.event.client_payload.publish_reference == true) }}

jobs:
  analyze:
    name: Analyze native library
    # 標準Public実行だけを許可する。有料runnerへの切替は用意しない。
    if: github.repository == 'sinsuirakv0/KBCS' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 235
    permissions:
      contents: write
    outputs:
      checkpoint: ${{ steps.pipeline.outputs.checkpoint || steps.source.outputs.checkpoint }}
      match_only: ${{ steps.source.outputs.match_only }}
    env:
      INPUT_MANIFEST: ${{ inputs.source_manifest || github.event.client_payload.source_manifest }}
      REVISION_LABEL: ${{ inputs.revision_label || github.event.client_payload.revision_label || 'ci-v1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /research/indexer/
            /research/inputs/
          sparse-checkout-cone-mode: false
      - name: Resolve verified JP publication
        id: source
        env:
          CHECK_ONLY: ${{ inputs.check_only }}
          ASSETS_COMMIT: ${{ inputs.assets_commit }}
          REQUESTED_CHECKPOINT: ${{ inputs.checkpoint }}
          STAGE: ${{ inputs.stage || 'all' }}
        shell: bash
        run: |
          if [[ -n "$REQUESTED_CHECKPOINT" ]]; then
            [[ "$REQUESTED_CHECKPOINT" =~ ^native-analysis-[0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z0-9_-]+-[a-f0-9]{16}$ ]]
            if [[ -n "$INPUT_MANIFEST" || -n "$ASSETS_COMMIT" || "$STAGE" == analyze ]]; then
              echo 'A checkpoint cannot be combined with a source selection' >&2
              exit 1
            fi
            if [[ "$CHECK_ONLY" != true ]]; then printf 'checkpoint=%s\n' "$REQUESTED_CHECKPOINT" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [[ "$STAGE" == references || "$STAGE" == match || "$STAGE" == backfill || ( -n "$INPUT_MANIFEST" && -n "$ASSETS_COMMIT" ) ]]; then
            echo 'Select a completed checkpoint for a stage replay, or select one source for analysis' >&2
            exit 1
          fi
          if [[ -z "$INPUT_MANIFEST" ]]; then
            args=()
            if [[ "$CHECK_ONLY" == true ]]; then args+=(--check-only); fi
            if [[ -n "$ASSETS_COMMIT" ]]; then args+=(--assets-commit "$ASSETS_COMMIT"); fi
            python3 -m indexer.upstream "${args[@]}"
          else
            python3 -c 'import os; from pathlib import Path; from indexer.ci import load_input, public_only; public_only(); load_input(Path(os.environ["INPUT_MANIFEST"]))'
            if [[ "$CHECK_ONLY" != true ]]; then echo 'needed=true' >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Expand analysis checkout
        if: steps.source.outputs.needed == 'true'
        run: git sparse-checkout disable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.source.outputs.needed == 'true'
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.source.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - name: Validate source and test pipeline
        if: steps.source.outputs.needed == 'true'
        env:
          BATTLECATS_APK_READ_TOKEN: ${{ secrets.BATTLECATS_APK_READ_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('BATTLECATS_APK_READ_TOKEN'):
              raise RuntimeError('Set BATTLECATS_APK_READ_TOKEN with read-only source repository access')
          PY
          python -m unittest indexer.test_store indexer.test_reference indexer.test_ci matcher.test_matching matcher.test_tracking
      - name: Install checksum-pinned analysis tools
        if: steps.source.outputs.needed == 'true'
        run: python -m indexer.ci setup
      - name: Analyze and save verified checkpoint
        if: steps.source.outputs.needed == 'true'
        id: pipeline
        env:
          BATTLECATS_APK_READ_TOKEN: ${{ secrets.BATTLECATS_APK_READ_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from indexer.ci import analyze
          manifest = os.environ.get('INPUT_MANIFEST', '')
          tag = analyze(Path(manifest), os.environ['REVISION_LABEL'], from_assets=not manifest)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'checkpoint={tag}\n')
          PY
      - name: Report status
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          ANALYSIS_NEEDED: ${{ steps.source.outputs.needed }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from indexer.store import LOCAL, read_json
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Native analysis\n\nStandard public Ubuntu runner. No Actions artifacts/cache, paid API or larger runner.\n\n')
              output.write(f"- Source check: `{os.environ['SOURCE_OUTCOME']}`; analysis requested: `{os.environ.get('ANALYSIS_NEEDED') == 'true'}`\n")
              output.write(f"- Pipeline step: `{os.environ['PIPELINE_OUTCOME']}`\n")
              for path in (LOCAL / 'cache').glob('*/*/*-ci-*/ci-status.json'):
                  state = read_json(path)
                  output.write(f"- Revision: `{path.parent.name}`; function processing complete: `{state.get('complete', False)}`\n")
                  if state.get('report'):
                      output.write(f"- Internal: `{state['report']['internal']}`; external: `{state['report']['external']}`\n")
              output.write('\nSee the `native-analysis-*` prerelease for verified text checkpoints. Re-run the same inputs to resume.\n')
          PY

  references:
    name: Generate reference documents
    needs: analyze
    if: needs.analyze.outputs.checkpoint != '' && needs.analyze.outputs.match_only != 'true' && inputs.stage != 'analyze' && inputs.stage != 'match' && inputs.stage != 'backfill'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CHECKPOINT: ${{ needs.analyze.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore checkpoint and generate references
        shell: bash
        run: |
          args=()
          if [[ "$PUBLISH_REFERENCE" == true ]]; then args+=(--publish); fi
          python3 -m indexer.ci references --checkpoint "$CHECKPOINT" "${args[@]}"

  structures:
    name: Prepare missing structure checkpoints
    needs: analyze
    if: needs.analyze.outputs.checkpoint != '' && inputs.stage != 'analyze' && inputs.stage != 'references'
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    permissions:
      contents: write
    env:
      CHECKPOINT: ${{ needs.analyze.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /research/indexer/
            /research/ghidra/
            /research/matcher/
          sparse-checkout-cone-mode: false
      - name: Check the structure asset inventory
        id: plan
        run: python3 -m indexer.ci backfill-plan --checkpoint "$CHECKPOINT"
      - name: Require permission to preserve missing checkpoints
        if: steps.plan.outputs.needed == 'true' && env.PUBLISH_REFERENCE != 'true'
        run: |
          echo 'Missing structure checkpoints. Run stage=backfill with publish_reference=true.' >&2
          exit 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.plan.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - name: Install pinned analysis runtime
        if: steps.plan.outputs.needed == 'true'
        run: python3 -m indexer.ci setup
      - name: Verify Ghidra extraction with independent ARM64 binaries
        if: steps.plan.outputs.needed == 'true'
        env:
          KBCS_TEST_GHIDRA: '1'
        run: python3 -m unittest matcher.test_tracking
      - name: Backfill missing structures
        if: steps.plan.outputs.needed == 'true'
        env:
          BATTLECATS_APK_READ_TOKEN: ${{ secrets.BATTLECATS_APK_READ_TOKEN }}
        run: python3 -m indexer.ci backfill --checkpoint "$CHECKPOINT" --publish

  match:
    name: Track native functions across versions
    needs: [analyze, references, structures]
    if: >-
      !cancelled() && needs.analyze.result == 'success' && needs.structures.result == 'success' &&
      inputs.stage != 'backfill' &&
      (needs.references.result == 'success' || inputs.stage == 'match' || needs.analyze.outputs.match_only == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CHECKPOINT: ${{ needs.analyze.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - name: Install pinned APK verification tool
        run: python3 -m indexer.ci setup-apk
      - name: Track verified versions and publish results
        env:
          BATTLECATS_APK_READ_TOKEN: ${{ secrets.BATTLECATS_APK_READ_TOKEN }}
        shell: bash
        run: |
          args=()
          if [[ "$PUBLISH_REFERENCE" == true ]]; then args+=(--publish); fi
          python3 -m indexer.ci match --checkpoint "$CHECKPOINT" "${args[@]}"
