name: Analyze native library and build references

on:
  workflow_dispatch:
    inputs:
      source_manifest:
        description: 'Pinned source manifest under research/inputs'
        type: string
        default: research/inputs/jp-1507021.json
      revision_label:
        description: 'Keep the same label to resume; change it for a fresh revision'
        type: string
        default: ci-v1
      publish_reference:
        description: 'Append the completed reference revision to main'
        type: boolean
        default: true
  repository_dispatch:
    types: [native-analysis-request]

permissions:
  contents: read

concurrency:
  group: native-analysis
  cancel-in-progress: false

jobs:
  analyze:
    # 標準Public実行だけを許可する。有料runnerへの切替は用意しない。
    if: github.repository == 'sinsuirakv0/KBCS' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}/research
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      INPUT_MANIFEST: ${{ inputs.source_manifest || github.event.client_payload.source_manifest || 'research/inputs/jp-1507021.json' }}
      REVISION_LABEL: ${{ inputs.revision_label || github.event.client_payload.revision_label || 'ci-v1' }}
      PUBLISH_REFERENCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_reference) || (github.event_name == 'repository_dispatch' && github.event.client_payload.publish_reference == true) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - name: Validate source and test pipeline
        env:
          BATTLECATS_APK_READ_TOKEN: ${{ secrets.BATTLECATS_APK_READ_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from indexer.ci import load_input, public_only
          public_only()
          load_input(Path(os.environ['INPUT_MANIFEST']))
          if not os.environ.get('BATTLECATS_APK_READ_TOKEN'):
              raise RuntimeError('Set BATTLECATS_APK_READ_TOKEN with read-only source repository access')
          PY
          python -m unittest indexer.test_store indexer.test_reference indexer.test_ci
      - name: Install checksum-pinned analysis tools
        run: python -m indexer.ci setup
      - name: Analyze, checkpoint, generate and optionally publish
        id: pipeline
        env:
          BATTLECATS_APK_READ_TOKEN: ${{ secrets.BATTLECATS_APK_READ_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from indexer.ci import run
          run(Path(os.environ['INPUT_MANIFEST']), os.environ['REVISION_LABEL'], os.environ['PUBLISH_REFERENCE'].lower() == 'true')
          PY
      - name: Report status
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from indexer.store import LOCAL, read_json
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Native analysis\n\nStandard public Ubuntu runner. No Actions artifacts/cache, paid API or larger runner.\n\n')
              output.write(f"- Pipeline step: `{os.environ['PIPELINE_OUTCOME']}`\n")
              for path in (LOCAL / 'cache').glob('*/*/*-ci-*/ci-status.json'):
                  state = read_json(path)
                  output.write(f"- Revision: `{path.parent.name}`; function processing complete: `{state.get('complete', False)}`\n")
                  if state.get('report'):
                      output.write(f"- Internal: `{state['report']['internal']}`; external: `{state['report']['external']}`\n")
              output.write('\nSee the `native-analysis-*` prerelease for verified text checkpoints. Re-run the same inputs to resume.\n')
          PY
