<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>KBCS</title><link rel="icon" href="/images/kbc-logo.png"><link rel="stylesheet" href="/src/shared/ui/site.css"><link rel="stylesheet" href="/src/features/units/style.css"><link rel="stylesheet" href="/src/features/stages/style.css"><link rel="stylesheet" href="/native.css"><script type="module" src="/src/app/main.js"></script><script type="module" src="/src/features/stages/search.js"></script></head>
<body data-page="stage-search"><div class="site-shell"><a class="skip-link" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="/" aria-label="KBCS ホーム"><img src="/images/kbc-logo.png" alt="" width="28" height="28"><span>KBCS</span></a><nav class="site-nav" aria-label="サイト"><a href="/">ホーム</a><a href="/pages/unit-search/">キャラ検索</a><a href="/pages/tunit-search/">敵検索</a><a href="/pages/stage-search/">ステージ</a></nav><div class="theme-switcher" role="group" aria-label="表示テーマ"><button type="button" class="theme-button" data-theme-value="original" aria-label="濃紺" title="濃紺"><span class="theme-dot theme-dot-original" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="dark" aria-label="ダーク" title="ダーク"><span class="theme-dot theme-dot-dark" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="light" aria-label="ライト" title="ライト"><span class="theme-dot theme-dot-light" aria-hidden="true"></span></button></div><button type="button" class="site-settings-trigger" data-site-settings>設定</button></header><main id="main" class="page-main stage-page"><h1 class="visually-hidden">ステージ検索</h1>
<div class="db-toolbar"><a href="/pages/unit-search/">キャラ検索</a><a href="/pages/tunit-search/">敵検索</a><span id="stage-version" class="db-meta"></span></div>
<p id="stage-status" role="status">ステージデータを読み込んでいます。</p><button id="stage-retry" type="button" hidden>再読み込み</button>
<form id="stage-filters" hidden>
<div class="db-toolbar"><input id="stage-query" type="search" aria-label="ステージ名・マップ名・ID" placeholder="ステージ名・マップ名・ID（例：大脱走、N017-5）"><button id="stage-reset" type="button">クリア</button></div>
<div class="db-toolbar"><label>シリーズ<select id="stage-series"><option value="">すべて</option></select></label><label>出現する敵<input id="stage-enemy" type="search" placeholder="敵名・ID" list="stage-enemy-options"></label><datalist id="stage-enemy-options"></datalist><fieldset id="stage-enemy-mode" class="stage-mode" aria-label="敵の組合せ"><label><input type="radio" name="enemyMode" value="all" checked><span>AND</span></label><label><input type="radio" name="enemyMode" value="any"><span>OR</span></label></fieldset></div>
<div class="stage-filter-row"><span>敵の属性・種族</span><fieldset id="stage-attribute-mode" class="stage-mode" aria-label="敵属性の組合せ"><label><input type="radio" name="attributeMode" value="any" checked><span>OR</span></label><label><input type="radio" name="attributeMode" value="all"><span>AND</span></label></fieldset><fieldset id="stage-attributes" class="db-filter-group" aria-label="出現する敵の属性・種族"></fieldset></div>
<output id="stage-icon-hint" class="db-meta" aria-live="polite"></output>
<details class="stage-filter-details"><summary>ギミック・詳細検索</summary><label>対象の冠<select id="stage-crown-filter"><option value="0">いずれかの冠</option><option value="1">1冠</option><option value="2">2冠</option><option value="3">3冠</option><option value="4">4冠</option></select></label><fieldset id="stage-gimmicks" class="db-filter-group" aria-label="ステージのギミック"></fieldset><div class="db-toolbar"><label><input id="stage-exclude-enemies" type="checkbox">指定した敵を除外</label><label><input id="stage-attributes-only" type="checkbox">選んだ属性・種族だけ</label></div><div class="db-toolbar"><div id="stage-reward-picker" class="stage-reward-control"><input id="stage-reward" type="hidden"><button type="button" data-reward-open>報酬を選ぶ</button><span data-reward-selected></span></div><label>背景ID<input id="stage-background" type="text" inputmode="numeric" placeholder="0, 10"></label><label>BGM ID<input id="stage-music" type="text" inputmode="numeric" placeholder="3, 31"></label></div><div id="stage-ranges" class="stage-ranges"></div><p class="db-meta">敵・属性のANDは、指定したすべてが出現するステージ。ギミックは選んだすべてに一致。敵は複数語を空白で区切れます。報酬は選んだすべてを含むステージを検索します。</p></details>
</form>
<section id="stage-results" aria-label="検索結果" hidden><div class="db-toolbar"><strong id="stage-count"></strong><label>表示<select id="stage-page-size"><option value="25">25件</option><option value="50">50件</option><option value="100">100件</option></select></label><label><input id="stage-show-enemies" type="checkbox">敵アイコン</label></div><div class="db-pagination" id="stage-pagination-top"></div><div class="db-table-wrap stage-search-wrap"><table id="stage-table" class="db-table db-search-table stage-search-table hide-stage-enemies"><thead></thead><tbody></tbody></table></div><p id="stage-empty" hidden>一致するマップがありません。</p><div class="db-pagination" id="stage-pagination"></div></section>
<output id="stage-message" role="status" class="db-meta"></output>
</main></div></body></html>
