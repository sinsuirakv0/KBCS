<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>KBCS</title><link rel="icon" href="/images/kbc-logo.png"><link rel="stylesheet" href="/src/shared/ui/site.css"><link rel="stylesheet" href="/src/features/units/style.css"><link rel="stylesheet" href="/native.css"><script type="module" src="/src/app/main.js"></script><link rel="stylesheet" href="/src/features/motion/style.css"><script type="module" src="/src/features/motion/viewer.js"></script></head><body class="units-page"><div class="site-shell"><a class="skip-link" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="/" aria-label="KBCS ホーム"><img src="/images/kbc-logo.png" alt="" width="28" height="28"><span>KBCS</span></a><nav class="site-nav" aria-label="サイト"><a href="/">ホーム</a><a href="/pages/unit-search/">キャラ検索</a><a href="/pages/tunit-search/">敵検索</a><a href="/pages/stage-search/">ステージ</a></nav><div class="theme-switcher" role="group" aria-label="表示テーマ"><button type="button" class="theme-button" data-theme-value="original" aria-label="濃紺" title="濃紺"><span class="theme-dot theme-dot-original" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="dark" aria-label="ダーク" title="ダーク"><span class="theme-dot theme-dot-dark" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="light" aria-label="ライト" title="ライト"><span class="theme-dot theme-dot-light" aria-hidden="true"></span></button></div><button type="button" class="site-settings-trigger" data-site-settings>設定</button></header><main id="main" class="page-main motion-workspace" data-motion-kind="effect">
<aside id="motion-explorer">
<div class="motion-character-controls"><label>対象<select id="motion-kind"><option value="unit">味方</option><option value="enemy">敵</option><option value="effect">その他</option></select></label><input id="motion-query" type="search" placeholder="名前・IDで絞り込み" aria-label="キャラを絞り込み"><select id="motion-character" aria-label="キャラ"></select><select id="motion-category" aria-label="素材の分類" hidden><option value="all">すべての素材</option><option value="effects">戦闘エフェクト</option><option value="other">背景・城・その他</option><option value="unit">味方の効果</option><option value="enemy">敵の効果</option></select><div id="motion-forms" class="motion-form-buttons"></div></div>
<div class="motion-explorer-tabs" role="tablist" aria-label="素材一覧"><button role="tab" data-explorer="parts" aria-selected="true">パーツ</button><button role="tab" data-explorer="files" aria-selected="false">ファイル</button><button role="tab" data-explorer="cuts" aria-selected="false">分割画像</button></div>
<div id="motion-part-panel"><select id="motion-resource" aria-label="パーツの素材"></select><div class="motion-part-actions"><button id="motion-all-visible">すべて表示</button><label><input type="checkbox" id="motion-descendants">子も操作</label></div><input id="motion-part-query" type="search" placeholder="パーツ名・番号" aria-label="パーツを絞り込み"><div id="motion-parts" class="motion-part-tree"></div></div>
<div id="motion-file-panel" hidden><div id="motion-files"></div></div>
<div id="motion-cut-panel" hidden><button id="motion-export-cut" disabled>選択した分割画像を保存</button><div id="motion-cuts" class="motion-cuts"></div></div>
</aside>
<aside id="motion-inspector"><h2>選択パーツ</h2><label><input id="motion-selection-outline" type="checkbox">選択枠を表示</label><div class="motion-inspector-actions"><button id="motion-solo" aria-pressed="false">単独表示</button><button id="motion-part-reset">表示を戻す</button></div><div id="motion-part-detail">パーツを選択</div><details><summary>キー・トラック</summary><div id="motion-tracks"></div></details><details><summary>モデル設定点</summary><div id="motion-configs"></div></details></aside>
<div class="motion-topbar"><h1 id="motion-title">その他モーション</h1><select id="motion-clip" aria-label="モーション"></select><label id="motion-effect-level-control" hidden>Lv<input id="motion-effect-level" type="number" min="1" max="20" value="3" aria-label="演出レベル"></label><button id="motion-fit">全体表示</button><label>倍率<input id="motion-zoom" type="range" min="10" max="500" value="100" aria-label="表示倍率"><output id="motion-zoom-label">100%</output></label><button id="motion-flip" aria-pressed="false">反転</button><label><input id="motion-grid" type="checkbox" checked>格子</label><button id="motion-save">PNG保存</button></div>
<div class="motion-stage" id="motion-stage" tabindex="0" title="ドラッグで移動 / ホイールで拡大 / ←→で1F / Spaceで再生"><canvas id="motion-canvas" aria-label="モーション再生"></canvas><canvas id="motion-overlay" aria-hidden="true"></canvas><div id="motion-status" role="status">素材を読み込んでいます。</div><span id="motion-phase"></span></div>
<section id="motion-source" class="motion-source" hidden><div><strong id="motion-source-name"></strong><button id="motion-download">ファイル保存</button><button id="motion-source-close">閉じる</button></div><details><summary>出典・SHA</summary><div id="motion-file-proof"></div></details><pre id="motion-source-text"></pre><img id="motion-source-image" alt="スプライトシート" hidden></section>
<div class="motion-transport"><button id="motion-rewind" aria-label="先頭">|◀</button><button id="motion-prev" aria-label="1フレーム戻る">−1F</button><button id="motion-play" aria-label="再生">▶</button><button id="motion-next" aria-label="1フレーム進む">＋1F</button><input id="motion-frame" type="number" min="0" value="0" aria-label="フレーム"><span id="motion-length">/ 0F</span><select id="motion-speed" aria-label="再生速度"><option value="0.25">0.25倍</option><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option></select><label><input id="motion-loop" type="checkbox" checked>ループ</label><label><input id="motion-interpolate" type="checkbox">補間表示</label></div>
<div class="motion-timeline"><input id="motion-scrub" type="range" min="0" max="1" value="0" step="1" aria-label="タイムライン"><div id="motion-key-strip"></div></div>
<p id="motion-message" role="status"></p>
</main></div></body></html>
