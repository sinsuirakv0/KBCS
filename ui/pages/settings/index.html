<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>設定 | KBCS</title><link rel="icon" href="/images/brand/app-icon.png"><link rel="stylesheet" href="/src/shared/ui/site.css"><link rel="stylesheet" href="/src/features/units/style.css"><link rel="stylesheet" href="/native.css"><link rel="stylesheet" href="/settings.css"><script type="module" src="/src/app/main.js"></script><script type="module" src="/settings.js"></script></head><body class="units-page"><div class="site-shell"><header class="site-header"><a class="brand" href="/"><img src="/images/brand/app-icon.png" alt="" width="28" height="28"><span>KBCS</span></a><nav class="site-nav"></nav><button type="button" class="site-settings-trigger" data-site-settings>設定</button></header><main id="main" class="page-main settings-page"><nav id="settings-navigation" aria-label="設定の項目"><a href="#appearance">見た目</a><a href="#data">データ管理</a><a href="#keyboard">キーボード</a><a href="#system">KBCSシステム情報</a></nav><aside id="settings-context"><p id="settings-version"></p><p id="settings-data-version"></p><p id="settings-task" role="status"></p></aside>
<section data-settings-section="appearance"><h1>見た目</h1><div id="appearance-settings"></div><details><summary>表示の初期値・設定の移行</summary><button type="button" id="settings-display">表示の初期値</button><button type="button" id="settings-transfer">エクスポート・インポート</button></details></section>
<section data-settings-section="data" hidden><h1>データ管理</h1><div class="settings-card"><div class="settings-actions"><button id="update-check" type="button">更新を確認</button><span id="update-check-state"></span></div><p id="data-release-state"></p><form id="import-form"><button id="import-button">データ取得・更新</button></form><div class="settings-actions"><button id="data-rebuild" type="button">原本からDBを作り直す</button><button id="data-verify" type="button">整合性を検査</button></div><p id="import-state" role="status"></p><p id="import-error" role="alert" hidden></p><pre id="verification-output" hidden></pre></div>
<div class="settings-card"><h2>KBCS本体</h2><p id="app-release-state"></p><button id="app-update" type="button">本体をダウンロード</button><button id="app-apply" type="button" hidden>再起動して更新</button></div>
<div class="settings-card"><h2>保存されているデータ</h2><p id="storage-state"></p><div id="database-summary" class="settings-stats"></div><details><summary>現在のDB・採用元</summary><pre id="database-metadata"></pre></details><p>使用中のDB・原本と、編成・持ち物は削除から保護しています。</p><div class="settings-actions"><button id="storage-parent" type="button">上のフォルダ</button><button id="storage-refresh" type="button">再読み込み</button><output id="storage-path"></output></div><div class="storage-table-wrap"><table><thead><tr><th>名前</th><th>種類</th><th>サイズ</th><th>更新日時</th><th>操作</th></tr></thead><tbody id="storage-files"></tbody></table></div><pre id="storage-preview" hidden></pre></div>
<details class="settings-card"><summary>手動取り込み</summary><form id="manual-import-form"><label>原本フォルダ<input id="asset-source" required></label><button id="manual-import-button">原本から取り込む</button></form></details></section>
<section data-settings-section="keyboard" hidden><h1>キーボード</h1><p>変更したいキーを押し、割り当てるキーを入力してください。1段表示では下段の5キーが表示中の5枠に対応し、Spaceで前半・後半を切り替えます。</p><div class="settings-actions"><button id="keyboard-reset" type="button">初期配置に戻す</button><output id="keyboard-status" role="status"></output></div><div id="keyboard-bindings"></div></section>
<section data-settings-section="system" hidden><h1>KBCSシステム情報</h1><div class="settings-actions"><button id="system-copy" type="button">診断情報をコピー</button><button id="system-export" type="button">診断情報を保存</button><output id="system-status" role="status"></output></div><div id="system-overview" class="settings-stats"></div><h2>実行環境と内部状態</h2><pre id="system-details"></pre></section>
</main></div></body></html>
