<body data-page="stage-detail"><div class="site-shell"><a class="skip-link" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="/" aria-label="KBCS ホーム"><img src="/images/kbc-logo.png" alt="" width="28" height="28"><span>KBCS</span></a><nav class="site-nav" aria-label="サイト"><a href="/">ホーム</a><a href="/pages/unit-search/">キャラ検索</a><a href="/pages/tunit-search/">敵検索</a><a href="/pages/stage-search/">ステージ</a></nav><div class="theme-switcher" role="group" aria-label="表示テーマ"><button type="button" class="theme-button" data-theme-value="original" aria-label="濃紺" title="濃紺"><span class="theme-dot theme-dot-original" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="dark" aria-label="ダーク" title="ダーク"><span class="theme-dot theme-dot-dark" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="light" aria-label="ライト" title="ライト"><span class="theme-dot theme-dot-light" aria-hidden="true"></span></button></div><button type="button" class="site-settings-trigger" data-site-settings>設定</button></header><main id="main" class="page-main stage-page">
