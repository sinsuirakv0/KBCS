<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>KBCS</title><link rel="icon" href="/images/kbc-logo.png"><link rel="stylesheet" href="/src/shared/ui/site.css"><link rel="stylesheet" href="/src/features/units/style.css"><link rel="stylesheet" href="/src/features/stages/style.css"><link rel="stylesheet" href="/native.css"><script type="module" src="/src/app/main.js"></script><link rel="stylesheet" href="/stage-sortie.css"></head><body class="units-page"><div class="site-shell"><a class="skip-link" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="/" aria-label="KBCS ホーム"><img src="/images/kbc-logo.png" alt="" width="28" height="28"><span>KBCS</span></a><nav class="site-nav" aria-label="サイト"><a href="/">ホーム</a><a href="/pages/unit-search/">キャラ検索</a><a href="/pages/tunit-search/">敵検索</a><a href="/pages/stage-search/">ステージ</a></nav><div class="theme-switcher" role="group" aria-label="表示テーマ"><button type="button" class="theme-button" data-theme-value="original" aria-label="濃紺" title="濃紺"><span class="theme-dot theme-dot-original" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="dark" aria-label="ダーク" title="ダーク"><span class="theme-dot theme-dot-dark" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="light" aria-label="ライト" title="ライト"><span class="theme-dot theme-dot-light" aria-hidden="true"></span></button></div><button type="button" class="site-settings-trigger" data-site-settings>設定</button></header><main id="main" class="page-main">
<p id="sortie-status" role="status">ステージを読み込み中</p>
<div id="sortie-content" hidden>
<nav id="sortie-stage-navigation" aria-label="ステージ一覧"><a href="/pages/stage-search/?play=1">マップ選択に戻る</a><div id="sortie-stages" class="sortie-stage-list"></div></nav>
<div id="sortie-setup">
<header class="sortie-header"><div><span id="sortie-map" class="sortie-map"></span><h1 id="sortie-title"></h1></div><a id="sortie-database-link">DB詳細</a></header>
<div class="sortie-layout"><section class="sortie-panel"><h2>冠</h2><div id="sortie-crowns" class="sortie-crowns"></div><p id="sortie-crown-rate"></p><div id="sortie-pattern"></div><p id="sortie-limit-summary"></p><details><summary>出現する敵</summary><div id="sortie-enemies" class="sortie-enemies"></div></details></section>
<section id="sortie-options" class="sortie-panel"><h2>使用する編成</h2><label><select id="sortie-formation" aria-label="使用する編成"></select><a id="sortie-formation-edit" href="/pages/formation/">編集</a></label><div id="sortie-formation-preview" class="sortie-formation" aria-label="選択中の編成"></div>
<dl class="sortie-summary"><dt>自城体力</dt><dd id="sortie-castle-health">—</dd><dt>スニャイパー 基礎ダメージ</dt><dd id="sortie-sniper-damage">—</dd></dl><details><summary>城体力の内訳</summary><dl id="sortie-health-breakdown" class="sortie-summary"></dl></details><p id="sortie-restricted" role="status"></p>
<h2>アイテム</h2><div id="sortie-items" class="sortie-items"></div><button id="sortie-launch" class="sortie-launch" aria-label="いざ出陣!!" disabled></button>
</section></div></div>
<section id="sortie-details" class="sortie-panel"><h2>ステージ情報</h2><dl id="sortie-stage-facts" class="sortie-summary"></dl><h2>出撃制限・条件</h2><div id="sortie-limits"></div><h2>背景・城・BGM</h2><div id="sortie-media"></div></section>
<div id="battle-controls" class="battle-controls" hidden aria-label="戦闘操作・情報"><div class="battle-actions"><button data-debug="toggle">一時停止</button><button data-debug="step">1F ▶</button><button data-debug="ten">10F ▶</button><button data-debug="menu">オプション</button><button data-debug="rows">2段</button><button data-debug="page">枠切替</button><button data-debug="camera">カメラ初期化</button><button data-debug="report">診断JSON</button><button data-debug="return">準備へ戻る</button><button data-debug="cheats" aria-expanded="false" aria-controls="battle-cheats">チート</button><label class="battle-aspect">戦闘速度<select data-battle-speed aria-label="戦闘速度"><option value="0">アイテムに従う</option></select></label><label class="battle-aspect">画面比率<select data-battle-aspect aria-label="戦闘画面の比率"><option value="20:9">Pixel 8（20:9）</option></select></label><output data-battle-clock>0F / 0.00秒</output></div><div id="battle-cheats" class="battle-cheats" hidden><label><input type="checkbox" data-cheat="1">お金無限</label><label><input type="checkbox" data-cheat="2">キャラ生産上限無視</label><label><input type="checkbox" data-cheat="4">再生産時間無し・即生産</label><label><input type="checkbox" data-cheat="8">精霊ボタン非表示</label></div><div class="battle-status-line" aria-live="polite"></div><div class="battle-state"></div><div class="battle-constraints"></div><div class="battle-stats" aria-label="動作情報"><output data-stat="fps">— FPS</output><output data-stat="average-fps">平均 — FPS</output><output data-stat="progress">進行 —</output><output data-stat="core">更新計算 —</output><output data-stat="scene">戦闘API —</output><output data-stat="draw">描画提出 —</output><output data-stat="lag">待ち 0F</output><output data-stat="cpu">CPU —</output><output data-stat="memory">RAM —</output><output data-stat="images">画像 —</output><output data-stat="queue">要求 —</output></div></div>
<section id="sortie-initial" class="battle-screen" hidden aria-label="戦闘画面"><div class="battle-stage"><canvas data-battle-background aria-hidden="true"></canvas><canvas id="sortie-canvas" width="960" height="640" aria-label="戦闘盤面・キャラスロット・お財布・にゃんこ砲" tabindex="0"></canvas><div class="battle-menu" data-battle-menu hidden><h2>一時停止</h2><button data-battle-control="1">戦闘に戻る</button><button data-battle-rows data-battle-control="3">スロット：2段</button><button data-battle-page data-battle-control="4" hidden>スロットのページを切り替える</button><button data-battle-control="return">出撃準備に戻る</button></div></div><div class="battle-toolbar"><span data-battle-message role="status"></span></div></section>
<output id="sortie-message" class="sortie-message" role="status"></output></div>
<div id="sortie-blackout" class="sortie-blackout" hidden><div><p>出撃準備中</p><output id="sortie-loading-status"></output><progress id="sortie-progress" value="0" max="1"></progress><button id="sortie-cancel">戻る</button></div></div>
</main></div><script type="module" src="/stage-sortie.js"></script></body></html>
