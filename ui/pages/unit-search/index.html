<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>KBCS</title><link rel="icon" href="/images/kbc-logo.png"><link rel="stylesheet" href="/src/shared/ui/site.css"><link rel="stylesheet" href="/src/features/units/style.css"><link rel="stylesheet" href="/native.css"><script type="module" src="/src/app/main.js"></script><script type="module" src="/src/features/units/search.js"></script></head>
<body data-page="unit-search" class="units-page">
  <div class="site-shell">
    <a class="skip-link" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="/" aria-label="KBCS ホーム"><img src="/images/kbc-logo.png" alt="" width="28" height="28"><span>KBCS</span></a><nav class="site-nav" aria-label="サイト"><a href="/">ホーム</a><a href="/pages/unit-search/">キャラ検索</a><a href="/pages/tunit-search/">敵検索</a><a href="/pages/stage-search/">ステージ</a></nav><div class="theme-switcher" role="group" aria-label="表示テーマ"><button type="button" class="theme-button" data-theme-value="original" aria-label="濃紺" title="濃紺"><span class="theme-dot theme-dot-original" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="dark" aria-label="ダーク" title="ダーク"><span class="theme-dot theme-dot-dark" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="light" aria-label="ライト" title="ライト"><span class="theme-dot theme-dot-light" aria-hidden="true"></span></button></div><button type="button" class="site-settings-trigger" data-site-settings>設定</button></header>
    <main id="main" class="page-main">
      <h1 class="visually-hidden">キャラ検索</h1>
      <form id="unit-search-form" role="search" aria-label="キャラ検索">
        <div class="db-toolbar"><input id="unit-query" type="search" aria-label="名前・ID" placeholder="名前・ID" autocomplete="off"><button type="button" id="unit-reset">クリア</button></div>
        <div class="unit-filter-row"><span class="unit-filter-label">レア度</span><fieldset id="unit-rarity" class="db-filter-group" aria-label="レアリティ"></fieldset></div>
        <div class="db-toolbar">
          <label>形態<select id="unit-form"><option value="last">最終形態</option><option value="all">全形態</option><option value="f">第1</option><option value="c">第2</option><option value="s">第3</option><option value="u">第4</option></select></label>
          <label>合計Lv<input id="unit-level" type="number" min="1" max="200" value="30"></label>
          <label>単位<select id="unit-time"><option value="seconds">秒</option><option value="frames">F</option></select></label>
          <label>種類<select id="unit-kind"><option value="all">すべて</option><option value="normal">通常</option><option value="overseas">海外</option><option value="spirit">精霊</option><option value="retired">削除済み</option><option value="other">その他</option></select></label>
          <label><input id="unit-apply-talents" type="checkbox">数値に本能を最大Lvで反映</label>
        </div>
        <div class="db-toolbar"><label title="第3形態以上で取得できる通常本能・超本能の属性と特性を最大Lvで探します。検索Lvや数値への本能反映とは別です。"><input id="unit-include-talents" type="checkbox">本能で追加される属性・特性も検索</label><span class="db-meta">超本能も含む・数値反映とは別</span></div>
        <div class="unit-match-toolbar">
          <fieldset id="unit-target-mode" class="unit-match-mode"><legend>属性</legend><label class="db-chip" title="選んだ属性のいずれかを持つ"><input type="radio" name="targetMode" value="any" checked><span>OR</span></label><label class="db-chip" title="選んだ属性をすべて持つ"><input type="radio" name="targetMode" value="all"><span>AND</span></label></fieldset>
          <fieldset id="unit-ability-mode" class="unit-match-mode"><legend>特性・効果</legend><label class="db-chip" title="選んだ特性・効果・無効・耐性・能力をすべて持つ"><input type="radio" name="abilityMode" value="all" checked><span>AND</span></label><label class="db-chip" title="選んだ特性・効果・無効・耐性・能力のいずれかを持つ"><input type="radio" name="abilityMode" value="any"><span>OR</span></label></fieldset>
        </div>
        <div class="unit-filter-row"><span class="unit-filter-label">属性</span><fieldset id="unit-targets" class="db-filter-group" aria-label="対象属性"></fieldset></div>
        <div class="unit-filter-row"><span class="unit-filter-label">特性</span><fieldset id="unit-traits" class="db-filter-group" aria-label="特性"></fieldset></div>
        <div id="unit-abilities"></div>
        <output id="unit-filter-hint" class="unit-filter-hint db-meta" aria-live="polite"></output>
        <details id="unit-filter-panel" class="unit-related"><summary id="unit-filter-summary">詳細検索・計算条件</summary>
          <div class="db-toolbar"><label><input id="unit-exact-targets" type="checkbox">選択属性以外を持たない</label><label><input id="unit-negate-abilities" type="checkbox">選択した特性・効果を除外</label></div>
          <div class="db-toolbar"><label>除外名<input id="unit-exclude" type="search" placeholder="除外する名前"></label><label>攻撃<select id="unit-attack-type"><option value="">すべて</option><option>単体</option><option>範囲</option></select></label><label>本能<select id="unit-talent-mode"><option value="">指定なし</option><option value="normal">本能あり</option><option value="super">超本能あり</option><option value="none">本能なし</option></select></label><label>実装形態<select id="unit-min-forms"><option value="0">指定なし</option><option value="2">第2以上</option><option value="3">第3以上</option><option value="4">第4あり</option></select></label></div>
          <div class="db-toolbar"><label><input id="unit-guaranteed" type="checkbox">選んだ効果・能力の発動率100%</label></div>
          <details open><summary>数値条件</summary>
          <div class="unit-ranges" id="unit-ranges"></div>
          </details>
          <details><summary>計算条件</summary><div class="db-toolbar"><label>体力のお宝 %<input id="unit-health-treasure" type="number" min="0" max="300" value="300"></label><label>攻撃のお宝 %<input id="unit-attack-treasure" type="number" min="0" max="300" value="300"></label><label>コスト<select id="unit-chapter"><option value="1">日本編1章</option><option value="2" selected>2章・未来・宇宙</option><option value="3">日本編3章</option></select></label><label>研究力 Lv<input id="unit-research-level" type="number" min="1" max="30" value="30"></label><label>研究力のお宝 %<input id="unit-research-treasure" type="number" min="0" max="300" value="300"></label></div></details>
        </details>
      </form>
      <p id="unit-active-filters" class="db-meta" hidden></p>
      <div class="unit-list-meta"><span id="unit-result-count" role="status">読み込み中</span><span id="unit-data-version" class="db-meta"></span></div>
      <div class="db-toolbar"><button id="unit-open-compare" type="button" disabled>比較（0/4）</button><button id="unit-clear-compare" type="button" hidden>比較をクリア</button><button id="unit-export" type="button" disabled>CSV</button><label>件数<select id="unit-page-size"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select></label><label><input type="checkbox" id="unit-show-properties" checked>属性・特性を表示</label></div>
      <p id="unit-message" class="unit-list-message" role="status" hidden></p><button id="unit-retry" type="button" hidden>再読み込み</button>
      <div class="db-table-wrap"><table class="db-table db-search-table" id="unit-table"><caption class="visually-hidden">キャラ検索の結果。体力・攻撃のお宝のみ反映し、本能・特性倍率・にゃんコンボは未適用。</caption><thead><tr>
        <th aria-label="比較"></th><th data-column="id" aria-sort="ascending"><button type="button" data-sort="id">ID ↑</button></th><th aria-label="画像"></th><th class="db-name" data-column="name"><button type="button" data-sort="name">キャラ</button></th><th data-column="rarity"><button type="button" data-sort="rarity">レア</button></th><th class="unit-properties-column">対象属性</th><th class="unit-properties-column">特性・効果</th><th data-column="hp"><button type="button" data-sort="hp">体力</button></th><th data-column="attack"><button type="button" data-sort="attack">攻撃力</button></th><th data-column="dps"><button type="button" data-sort="dps">DPS</button></th><th data-column="range"><button type="button" data-sort="range">射程</button></th><th data-column="cost"><button type="button" data-sort="cost">コスト</button></th><th data-column="speed"><button type="button" data-sort="speed">速度</button></th><th data-column="respawn"><button type="button" data-sort="respawn">再生産</button></th>
      </tr></thead><tbody id="unit-results"></tbody></table></div>
      <div class="db-pagination"><button type="button" id="unit-prev">前</button><span id="unit-page-status" class="db-page-status"></span><button type="button" id="unit-next">次</button></div>
      <details class="unit-related"><summary>計算条件の注記</summary><p id="unit-search-calculation-note" class="db-meta unit-detail-notice">お宝の体力・攻撃力を反映。本能・特性倍率・にゃんコンボは未適用。研究力「最大」はLv30・お宝300%。</p></details>
      <dialog id="unit-compare-dialog" class="db-dialog" aria-labelledby="unit-compare-title"><div class="db-toolbar"><h2 id="unit-compare-title">キャラ比較</h2><button id="unit-close-compare" type="button">閉じる</button></div><div class="db-table-wrap" id="unit-compare-table"></div></dialog>
    </main>
    
  </div>
</body>
</html>
