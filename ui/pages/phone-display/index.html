<!doctype html>
<html lang="ja">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#0d1b3b">
 <title>KBCS スマホ表示</title>
 <link rel="icon" href="/images/kbc-logo.png">
 <link rel="stylesheet" href="/phone-display.css">
 <script type="module" src="/phone-display.js"></script>
</head>
<body>
 <section id="phone-standby" aria-label="KBCSの待機画面">
  <img src="/images/brand/loading-center.png" alt="KBCS Kenkou Battle Cats Simulator">
  <div>
   <p id="phone-status" role="status">PCでステージを選んでください</p>
  </div>
 </section>
 <div id="phone-viewport" hidden></div>
 <button id="phone-fullscreen" type="button">横向き全画面</button>
 <p id="phone-fullscreen-hint" role="status" hidden>画面下の案内は、横にスワイプすると閉じられます。</p>
 <p id="phone-display-error" role="status" hidden></p>
</body>
</html>
