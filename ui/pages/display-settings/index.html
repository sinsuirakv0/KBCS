<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>DBの表示設定 | KBCS</title><link rel="icon" href="/images/brand/app-icon.png"><link rel="stylesheet" href="/src/shared/ui/site.css"><link rel="stylesheet" href="/src/features/stages/style.css"><link rel="stylesheet" href="/native.css"><link rel="stylesheet" href="/src/shared/ui/display-editor.css"><script type="module" src="/src/app/main.js"></script><script type="module" src="/display-settings.js"></script></head>
<body data-page="display-settings"><div class="site-shell"><a class="skip-link" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="/" aria-label="KBCS ホーム"><img src="/images/kbc-logo.png" alt="" width="28" height="28"><span>KBCS</span></a><nav class="site-nav" aria-label="サイト"><a href="/">ホーム</a><a href="/pages/unit-search/">キャラ検索</a><a href="/pages/tunit-search/">敵検索</a><a href="/pages/stage-search/">ステージ</a></nav><div class="theme-switcher" role="group" aria-label="表示テーマ"><button type="button" class="theme-button" data-theme-value="original" aria-label="濃紺" title="濃紺"><span class="theme-dot theme-dot-original" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="dark" aria-label="ダーク" title="ダーク"><span class="theme-dot theme-dot-dark" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="light" aria-label="ライト" title="ライト"><span class="theme-dot theme-dot-light" aria-hidden="true"></span></button></div><button type="button" class="site-settings-trigger" data-site-settings>設定</button></header>
<main id="main" class="page-main"><div class="db-toolbar"><a href="/pages/settings/">設定へ</a><a id="display-open-detail" href="/pages/stage-detail/">ステージ詳細を開く</a></div><h1 class="table-title">DBの表示設定</h1>
<label>データベース <select id="display-database"><option value="stages">ステージ</option></select></label>
<div class="display-editor-layout"><section class="table-section"><h2>表示項目の編集</h2><div class="table-section-body" id="display-editor"></div></section><section class="table-section"><h2>プレビュー</h2><div class="table-section-body">
<div class="db-toolbar"><label>マップ・ステージを検索 <input type="search" id="display-map-query"></label><label>マップ <select id="display-map"></select></label><label>ステージ <select id="display-stage"></select></label></div>
<div class="db-toolbar"><label>冠 <select id="display-crown"></select></label><label>表示 <select id="display-mode"><option value="basic">通常</option><option value="detail">詳細</option></select></label><label>単位 <select id="display-time"><option value="seconds">秒</option><option value="frames">F</option></select></label><label><input type="checkbox" id="display-stats">敵ステータス</label></div>
<output id="display-preview-status" role="status"></output><div id="display-preview-map"></div><div id="display-preview-stage"></div></div></section></div></main></div></body></html>
