[workspace]
members = ["crates/kbcs-data", "crates/kbcs-bridge", "crates/kbcs-app"]
resolver = "3"

[workspace.package]
version = "0.1.36"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
